---
name: gcc 15

"on":
  push:
    branches:
      - main
      - devel
  pull_request:

jobs:
  build:
    name: Compiles with gcc 15
    runs-on: ubuntu-latest
    container: gcc:16

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: install packages
        run: sudo apt install build-essential nettle-dev time
      - name: bootstrap
        run: ./bootstrap.sh
      - name: configure
        run: ./configure CXX=g++-16 CXXFLAGS=-std=c++17
      - name: build
        run: make
      - name: check
        run: make check
      - name: store the logs as an artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          path: '**/*.log'
